<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>口袋證券 · 下單改類申請</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --pkt-red-main: #E95465;
  --pkt-red-hover: #D03B4C;
  --pkt-red-deep: #E60039;
  --pkt-member-bg: #FEEDED;
  --pkt-pink-50: #FFF2F2;
  --pkt-ink: #252525;
  --pkt-gray-700: #3E3A39;
  --pkt-gray-500: #717071;
  --pkt-gray-300: #C8C9CA;
  --pkt-gray-100: #EEEEEF;
  --pkt-gray-50: #F5F5F5;
  --pkt-white: #FFFFFF;
  --pkt-shadow-card: 0 1px 5px 0 rgba(0, 0, 0, 0.05);
  --pkt-shadow-lift: 3px 5px 10px 0 rgba(0, 0, 0, 0.10);
  --pkt-shadow-header: 0 1px 1px 0 rgba(0, 0, 0, 0.25);
  --pkt-r-md: 8px;
  --pkt-r-lg: 10px;
  --pkt-r-xl: 16px;
  --pkt-r-pill: 100px;
  --pkt-font-sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --pkt-font-latin: "Inter", "Noto Sans TC", sans-serif;
  --content-max: 1200px;
  --header-h: 72px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--pkt-font-sans);
  font-size: 16px;
  line-height: 1.5;
  color: var(--pkt-ink);
  background: var(--pkt-gray-50);
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button, input, select { font-family: inherit; }

.pkt-header {
  position: sticky;
  top: 0;
  z-index: 100;
  height: var(--header-h);
  background: var(--pkt-white);
  box-shadow: var(--pkt-shadow-header);
  display: flex;
  align-items: center;
  padding: 0 40px;
}
.pkt-brand { display: inline-flex; align-items: center; gap: 10px; }
.pkt-shield { width: 40px; height: 40px; color: var(--pkt-red-deep); }
.pkt-brand-text { font-weight: 700; font-size: 22px; letter-spacing: 0.04em; }

.pkt-main {
  max-width: var(--content-max);
  margin: 0 auto;
  padding: 28px 40px 80px;
}

.pkt-page-title {
  margin: 0 0 16px;
  font-size: 22px;
  font-weight: 700;
  color: var(--pkt-ink);
}

.pkt-panel {
  background: var(--pkt-white);
  border-radius: 0 0 var(--pkt-r-xl) var(--pkt-r-xl);
  box-shadow: var(--pkt-shadow-card);
  padding: 20px 28px 28px;
}

/* 分頁在灰底上，白卡從搜尋列開始 */
.cr-tabs {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  margin: 0;
  padding: 0;
  border-bottom: none;
}
.cr-tab {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 108px;
  height: 40px;
  padding: 0 22px;
  margin-bottom: -1px;
  border: 1px solid var(--pkt-gray-100);
  border-bottom: none;
  border-radius: 10px 10px 0 0;
  background: #FAFAFA;
  color: var(--pkt-gray-500);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.cr-tab.is-active {
  background: var(--pkt-red-main);
  border-color: var(--pkt-red-main);
  color: #fff;
}
.cr-tab[hidden] { display: none; }

.cr-toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.cr-field-label {
  flex: 0 0 auto;
  font-size: 16px;
  font-weight: 600;
  color: var(--pkt-ink);
  white-space: nowrap;
}
.cr-account {
  flex: 0 1 280px;
  min-width: 240px;
  height: 40px;
  padding: 0 14px;
  border: 1px solid #000;
  border-radius: 6px;
  font-size: 16px;
  color: var(--pkt-ink);
  background: #FAFAFA;
  cursor: default;
}
.cr-search {
  position: relative;
  flex: 0 0 220px;
}
.cr-search input {
  width: 100%;
  height: 40px;
  padding: 0 14px 0 38px;
  border: 1px solid var(--pkt-gray-300);
  border-radius: 6px;
  font-size: 15px;
  background: #fff;
}
.cr-search input:focus {
  outline: none;
  border-color: var(--pkt-red-main);
}
.cr-search svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--pkt-gray-500);
  pointer-events: none;
}
.cr-btn-search {
  height: 40px;
  min-width: 88px;
  padding: 0 20px;
  border: none;
  border-radius: 8px;
  background: var(--pkt-red-main);
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.cr-btn-search:hover { background: var(--pkt-red-hover); }
.cr-btn-search:disabled {
  background: var(--pkt-gray-300);
  cursor: not-allowed;
}

.cr-records-head { margin-bottom: 18px; }
.cr-toolbar--account { margin-bottom: 12px; }

.cr-records-query {
  padding: 16px;
  background: #FAFAFA;
  border: 1px solid var(--pkt-gray-100);
  border-radius: var(--pkt-r-md);
}

.cr-records-query__title {
  display: block;
  margin-bottom: 12px;
  font-size: 14px;
  font-weight: 600;
  color: var(--pkt-ink);
}

.cr-records-query__fields {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px 16px;
  margin-bottom: 12px;
}

.cr-records-query__field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--pkt-ink);
}

.cr-records-query__field input,
.cr-records-query__field select {
  height: 40px;
  padding: 0 12px;
  border: 1px solid var(--pkt-gray-300);
  border-radius: 6px;
  font-size: 15px;
  font-family: inherit;
  background: #fff;
  color: var(--pkt-ink);
}

.cr-records-query__field input:focus,
.cr-records-query__field select:focus {
  outline: none;
  border-color: var(--pkt-red-main);
}

.cr-records-query__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.cr-btn-plain {
  height: 40px;
  min-width: 88px;
  padding: 0 20px;
  border: 1px solid var(--pkt-gray-300);
  border-radius: 8px;
  background: #fff;
  color: var(--pkt-ink);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.cr-btn-plain:hover { background: var(--pkt-gray-50); }

.cr-table-wrap { width: 100%; overflow: auto; }

.cr-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 16px;
}
.cr-table thead th {
  padding: 12px 16px;
  background: var(--pkt-member-bg);
  font-weight: 600;
  text-align: left;
  white-space: nowrap;
}
.cr-table thead th:first-child { border-radius: 8px 0 0 8px; }
.cr-table thead th:last-child { border-radius: 0 8px 8px 0; }
.cr-sort {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: none;
  background: transparent;
  padding: 0;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  color: inherit;
}
.cr-sort__arrows {
  display: inline-flex;
  flex-direction: column;
  gap: 0;
  line-height: 1;
  font-size: 9px;
  color: #C0C0C0;
}
.cr-sort__arrows .is-on { color: var(--pkt-red-main); }

.cr-view { display: none; }
.cr-view.is-on { display: block; }
.cr-tabs[hidden] { display: none; }

#view-apply .cr-table thead th:nth-child(3),
#view-apply .cr-table thead th:nth-child(4),
#view-apply .cr-table thead th:nth-child(5),
#view-apply .cr-table tbody td:nth-child(3),
#view-apply .cr-table tbody td:nth-child(4),
#view-apply .cr-table tbody td:nth-child(5) {
  text-align: center;
}
#view-apply .cr-table thead th:nth-child(3) .cr-sort,
#view-apply .cr-table thead th:nth-child(4) .cr-sort {
  justify-content: center;
  width: 100%;
}

#view-records .cr-table thead th,
#view-records .cr-table tbody td { text-align: center; }
#view-records .cr-sort { justify-content: center; width: 100%; }

.cr-status {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 100px;
  font-size: 14px;
  font-weight: 600;
}
.cr-status--approved { background: #E8F6EE; color: #1B7A3A; }
.cr-status--source { background: var(--pkt-pink-50); color: var(--pkt-red-main); }
.cr-status--error { background: #F3E8FF; color: #6B21A8; }
.cr-status--control { background: #FFF4E5; color: #B45309; }

.demo-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 300; /* 須高於 .pkt-modal(200)，提示開啟後仍可操作 Demo 列 */
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  padding: 10px 40px;
  background: #1F2937;
  color: #F9FAFB;
  font-size: 13px;
  pointer-events: auto;
}
.demo-bar label { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.demo-bar select, .demo-bar button {
  height: 30px;
  border-radius: 6px;
  border: 1px solid #4B5563;
  background: #111827;
  color: #F9FAFB;
  font-size: 13px;
  padding: 0 10px;
  pointer-events: auto;
  position: relative;
  z-index: 1;
}
.demo-bar button {
  background: var(--pkt-red-main);
  border-color: var(--pkt-red-main);
  cursor: pointer;
  font-weight: 600;
}
.demo-bar button:hover { background: var(--pkt-red-hover); }
.demo-bar__hint { color: #9CA3AF; }
body.has-demo-bar {
  padding-top: var(--demo-bar-h, 50px);
}
body.has-demo-bar .pkt-header { top: var(--demo-bar-h, 50px); }

.cr-table tbody td {
  padding: 16px;
  border-bottom: 1px solid var(--pkt-gray-100);
  font-variant-numeric: tabular-nums;
  font-family: var(--pkt-font-latin), var(--pkt-font-sans);
}
.cr-table tbody tr.cr-row:nth-child(odd) td { background: #fff; }
.cr-table tbody tr.cr-row:nth-child(even) td { background: #FAFAFA; }
.cr-table tbody tr.cr-row.is-selected td { background: var(--pkt-pink-50); }

.cr-name-cell {
  font-family: var(--pkt-font-sans);
}
.cr-est {
  white-space: nowrap;
}
.cr-num-red { color: var(--pkt-red-main); font-weight: 700; }
.cr-num-warn { color: var(--pkt-red-deep); font-weight: 700; }
.cr-table tfoot tr.is-over td,
.cr-summary tfoot tr.is-over td { background: #FFE8E8; }
.pkt-panel.is-locked .cr-table-wrap,
.pkt-panel.is-locked .cr-toolbar,
.pkt-panel.is-locked .cr-footer {
  pointer-events: none;
  opacity: 0.45;
}
.cr-btn-search:disabled { opacity: 0.45; cursor: not-allowed; }
.cr-table tfoot td {
  padding: 14px 16px;
  background: var(--pkt-pink-50);
  border-top: 1px solid var(--pkt-gray-100);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  font-family: var(--pkt-font-sans);
  text-align: right;
}

.cr-stepper {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 148px;
}
.cr-stepper__btn {
  width: auto;
  min-width: 28px;
  height: 36px;
  padding: 0 2px;
  border: none;
  background: transparent;
  font-size: 22px;
  line-height: 1;
  font-weight: 400;
  color: #6B6B6B;
  cursor: pointer;
}
.cr-stepper__btn:hover:not(:disabled) { color: var(--pkt-red-main); }
.cr-stepper__btn:disabled { opacity: 0.35; cursor: not-allowed; }
.cr-stepper__field {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  width: 92px;
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--pkt-gray-300);
  border-radius: 12px;
  background: #fff;
}
.cr-stepper__field:focus-within {
  border-color: var(--pkt-red-main);
}
.cr-stepper__input {
  width: 100%;
  min-width: 0;
  height: 100%;
  padding: 0;
  border: 0;
  background: transparent;
  outline: none;
  font-family: var(--pkt-font-latin), var(--pkt-font-sans);
  font-size: 16px;
  font-weight: 500;
  color: var(--pkt-ink);
  text-align: left;
}
.cr-stepper__unit {
  flex: 0 0 auto;
  margin-left: 6px;
  color: var(--pkt-ink);
  font-family: var(--pkt-font-sans);
  font-size: 16px;
}

.cr-empty {
  padding: 48px 16px;
  text-align: center;
  color: var(--pkt-gray-500);
}

.cr-pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 20px 8px 4px;
  flex-wrap: wrap;
}
.cr-pagination__btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1.5px solid var(--pkt-red-main);
  background: #fff;
  color: var(--pkt-red-main);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.cr-pagination__btn:hover:not(:disabled):not(.is-active) {
  background: var(--pkt-member-bg);
}
.cr-pagination__btn.is-active {
  background: var(--pkt-red-main);
  border-color: var(--pkt-red-main);
  color: #fff;
  cursor: default;
}
.cr-pagination__btn:disabled {
  border-color: var(--pkt-gray-300);
  color: var(--pkt-gray-300);
  cursor: not-allowed;
}
.cr-pagination__info {
  font-size: 13px;
  color: var(--pkt-gray-500);
}

.cr-footer {
  display: flex;
  justify-content: center;
  margin-top: 28px;
}
.cr-btn-next {
  min-width: 240px;
  height: 44px;
  border: none;
  border-radius: var(--pkt-r-pill);
  background: var(--pkt-red-main);
  color: #fff;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
}
.cr-btn-next:hover { background: var(--pkt-red-hover); }
.cr-btn-next:disabled {
  background: var(--pkt-gray-300);
  cursor: not-allowed;
}

.pkt-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.pkt-modal.is-open { display: flex; }
.pkt-modal__backdrop {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.45); border: 0; cursor: default;
}
.pkt-modal__dialog {
  position: relative;
  width: min(720px, calc(100vw - 32px));
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,.18);
}
.pkt-modal__title {
  margin: 0;
  padding: 14px 18px;
  background: #f8cdd1;
  font-size: 18px;
  font-weight: 700;
  text-align: center;
}
.pkt-modal__body { padding: 16px 18px 12px; }
.pkt-modal--notice.is-open {
  align-items: flex-start;
  padding-top: 328px;
}
.pkt-modal--notice .pkt-modal__backdrop {
  background: transparent;
  cursor: default;
}
.pkt-modal--notice .pkt-modal__dialog {
  width: min(560px, calc(100vw - 32px));
  border-radius: 10px;
}
.pkt-modal--notice.is-convert .pkt-modal__dialog {
  width: min(520px, calc(100vw - 32px));
}
.pkt-modal--notice .pkt-modal__title {
  padding: 16px 40px;
  background: var(--pkt-member-bg);
  border-bottom: 1px solid rgba(233, 84, 101, 0.18);
  font-size: 20px;
  font-weight: 700;
  line-height: 1.5;
  text-align: center;
}
.pkt-modal--notice .pkt-modal__body {
  padding: 24px 40px;
  text-align: center;
}
.pkt-modal--notice .pkt-modal__notice {
  margin: 0 0 16px;
  font-size: 16px;
  font-weight: 400;
  line-height: 1.75;
  text-align: center;
  color: var(--pkt-ink);
}
.pkt-modal--notice .pkt-modal__notice:last-child { margin-bottom: 0; }
.pkt-modal--notice .pkt-modal__notice--alert {
  color: var(--pkt-red-main);
}
.pkt-modal--notice .pkt-modal__notice a {
  color: var(--pkt-ink);
  font-weight: 700;
  text-decoration: underline;
  white-space: nowrap;
}
.pkt-modal--notice .pkt-modal__actions {
  gap: 12px;
  padding: 0 40px 24px;
}
.pkt-modal--notice .pkt-modal__btn {
  height: 44px;
  border-radius: 8px;
  font-size: 16px;
}
.pkt-modal--notice .pkt-modal__btn--cancel:hover { background: var(--pkt-pink-50); }
.pkt-modal--notice .pkt-modal__btn--submit:hover { background: var(--pkt-red-hover); }
.pkt-modal--notice.is-single .pkt-modal__btn--cancel { display: none; }
.pkt-modal--notice.is-single .pkt-modal__actions {
  justify-content: center;
}
.pkt-modal--notice.is-single .pkt-modal__btn--submit {
  flex: 0 0 auto;
  min-width: 120px;
  width: 120px;
  height: 40px;
  font-size: 15px;
}
.pkt-modal__warning {
  margin: 0 0 12px;
  color: var(--pkt-red-main);
  font-size: 14px;
  font-weight: 700;
  text-align: center;
}
.pkt-modal__actions {
  display: flex; gap: 12px; padding: 8px 18px 18px;
}
.pkt-modal__btn {
  flex: 1; height: 42px; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer;
}
.pkt-modal__btn--cancel {
  border: 1px solid var(--pkt-red-main); background: #fff; color: var(--pkt-red-main);
}
.pkt-modal__btn--submit {
  border: 0; background: var(--pkt-red-main); color: #fff;
}

.cr-summary {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.cr-summary th {
  background: var(--pkt-member-bg);
  padding: 10px;
  text-align: center;
}
.cr-summary td { padding: 10px; text-align: center; border-bottom: 1px solid var(--pkt-gray-100); }
.cr-summary tfoot td {
  padding: 12px 10px;
  text-align: right;
  font-weight: 600;
  border-bottom: none;
  background: var(--pkt-pink-50);
}

.pkt-toast {
  display: none;
  position: fixed;
  top: 88px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 210;
  padding: 12px 24px;
  background: var(--pkt-ink);
  color: #fff;
  border-radius: 8px;
}
.pkt-toast.is-visible { display: block; }

.pkt-mobile-menu, .pkt-mobile-logout { display: none; }

@media (max-width: 900px) {
  .pkt-header { padding: 0 16px; }
  .pkt-main { padding: 20px 16px 64px; }
  .pkt-panel { padding: 16px 16px 20px; }
  .cr-toolbar { flex-wrap: wrap; }
  .cr-records-query__fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pkt-modal--notice.is-open { padding-top: 360px; }
}
@media (max-width: 560px) {
  .pkt-header { height: 56px; justify-content: center; }
  .pkt-brand-text { font-size: 18px; }
  .pkt-shield { width: 27px; height: 27px; }
  .pkt-mobile-menu, .pkt-mobile-logout {
    display: inline-flex; position: absolute; top: 50%; transform: translateY(-50%);
    height: 34px; align-items: center; justify-content: center; background: #fff;
  }
  .pkt-mobile-menu { left: 12px; width: 34px; border: 0; font-size: 20px; }
  .pkt-mobile-logout {
    right: 12px; min-width: 56px; padding: 0 12px;
    border: 1px solid var(--pkt-red-main); border-radius: 7px; color: var(--pkt-red-main);
  }
  .pkt-page-title { font-size: 18px; }
  .cr-btn-next { width: 100%; }
  .cr-records-query__fields { grid-template-columns: 1fr; }
}
  </style>
</head>
<body class="has-demo-bar">
  <div class="demo-bar" id="demo-bar" role="region" aria-label="Demo 提示控制">
    <strong>Demo 控制</strong>
    <label>進場提示
      <select id="demo-notice">
        <option value="convert">可辦理（確認）</option>
        <option value="credit">未開信用戶（直轉加開）</option>
        <option value="quota">融資餘額不足</option>
        <option value="unavailable">無單／逾時</option>
        <option value="none">不跳出</option>
      </select>
    </label>
    <label>送出結果
      <select id="demo-submit">
        <option value="success">成功</option>
        <option value="source">配額不足</option>
        <option value="network">連線異常／系統錯誤</option>
        <option value="control">系統管制</option>

  var NOTICE_TYPES = ['credit', 'quota', 'convert', 'unavailable', 'none'];

  function formatPrice(n) {

  function formatMoney(n) {
    return Number(n).toLocaleString('zh-TW');

    return r.price * getQty(r.id) * SHARES_PER_LOT;

    var sum = 0;

  function findRow(id) {
    for (var i = 0; i < APPLY_ROWS.length; i++) {
      if (APPLY_ROWS[i].id === id) return APPLY_ROWS[i];

    return null;

    return CLIENT_MARGIN_LIMIT - Math.round(totalEstimate());

    return Math.max(0, r.lots - getQty(r.id));
  }

      '</span> 元</td></tr>';

  function lockAfterBlockingNotice() {

    var n = parseInt(String(value).replace(/[^\d]/g, ''), 10);
    if (isNaN(n) || n < 0) n = 0;
    if (n > max) n = max;
    convertQty[id] = n;
    return n;

  function matchKeyword(r) {

  function currentRows() {
    var list = APPLY_ROWS.filter(matchKeyword);

      else if (sortKey === 'orderNo') cmp = String(a.orderNo).localeCompare(String(b.orderNo), 'zh-Hant');

      return sortDir === 'asc' ? cmp : -cmp;

  function parseRecordDate(str) {

  }
  function parseInputDate(str) {

      if (recDateEnd) {
        var endDate = parseInputDate(recDateEnd);
        if (endDate && recordDate > endDate) return false;

    if (recKeyword) {

      if (r.code.toLowerCase().indexOf(q) === -1 && r.name.indexOf(recKeyword) === -1) return false;

  function hasRecordFilters() {

    var list = loadRecords().filter(matchRecordFilters);

  function renderRecordsPagination(totalItems) {
    var totalPages = Math.max(1, Math.ceil(totalItems / REC_PAGE_SIZE));

  function renderRecords() {

      var key = btn.getAttribute('data-sort');
      btn.querySelectorAll('[data-dir]').forEach(function (arrow) {
        arrow.classList.toggle('is-on', key === recSortKey && arrow.getAttribute('data-dir') === recSortDir);
      });
    });
    var rows = recCurrentRows();
    renderRecordsPagination(rows.length);
    recExport.disabled = rows.length === 0;
    if (!rows.length) {
      recTbody.innerHTML = '<tr><td class="cr-empty" colspan="6">' +
        (hasRecordFilters() ? '查無符合條件的申請紀錄' : '尚無申請紀錄') +
        '</td></tr>';
      return;
    }
    var totalPages = Math.max(1, Math.ceil(rows.length / REC_PAGE_SIZE));
    if (recPage > totalPages) recPage = totalPages;
    var start = (recPage - 1) * REC_PAGE_SIZE;
    var pageRows = rows.slice(start, start + REC_PAGE_SIZE);
    recTbody.innerHTML = pageRows.map(function (r) {
      return (
        '<tr class="cr-row">' +
          '<td>' + r.date + '</td>' +
          '<td class="cr-name-cell">' + r.code + ' ' + r.name + '</td>' +
          '<td>' + formatPrice(r.price) + '</td>' +
          '<td>' + r.lots.toLocaleString('zh-TW') + '</td>' +
          '<td>' + (r.convert == null ? 0 : r.convert).toLocaleString('zh-TW') + '</td>' +
          '<td><span class="cr-status ' + (STATUS_CLASS[r.status] || STATUS_CLASS.approved) + '">' + (STATUS[r.status] || STATUS.approved) + '</span></td>' +
        '</tr>'
      );
    }).join('');
  }
  function exportRecordsCsv() {
    var rows = recCurrentRows();
    if (!rows.length) return;
    var header = ['申請日期', '股票代號', '股票名稱', '單價', '今日整股成交張數', '改資買張數', '狀態'];
    var lines = rows.map(function (r) {
      return [
        r.date,
        r.code,
        r.name,
        formatPrice(r.price),
        r.lots,
        r.convert == null ? 0 : r.convert,
        STATUS[r.status] || STATUS.approved
      ];
    });
    var csv = [header].concat(lines)
      .map(function (cols) {
        return cols.map(function (v) {
          return '"' + String(v).replace(/"/g, '""') + '"';
        }).join(',');
      })
      .join('\r\n');
    var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '改類申請紀錄_' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

      if (h === 'apply') return 'records';

      return 'records';
    }
    if (h === 'apply' || h === 'records') return h;
    var q = new URLSearchParams(window.location.search).get('view');
    if (q === 'empty') return 'records';
    if (q === 'records' || q === 'apply') return q;
    return 'apply';

  function showView(name) {

    if (name === 'empty') name = 'records';

    viewApply.classList.toggle('is-on', name === 'apply');
    viewRecords.classList.toggle('is-on', name === 'records');
    tabApply.hidden = unavailableMode;
    crTabs.hidden = false;
    tabApply.classList.toggle('is-active', name === 'apply');
    tabRecords.classList.toggle('is-active', name === 'records');

    tabRecords.setAttribute('aria-current', name === 'records' ? 'page' : '');

    if (name === 'records') renderRecords();
    if (unavailableMode && !unavailableNoticeShown) {
      unavailableNoticeShown = true;
      entryNoticeOpened = true;

  function stepperHtml(r) {
    var qty = getQty(r.id);
    var disabled = pageLocked ? 'disabled' : '';
    var decOff = pageLocked || qty <= 0 ? 'disabled' : '';
    var incOff = pageLocked || qty >= r.lots ? 'disabled' : '';
    return (
      '<div class="cr-stepper" data-stepper="' + r.id + '" data-max="' + r.lots + '">' +
        '<button type="button" class="cr-stepper__btn" data-step="-1" ' + decOff + ' aria-label="減少 1 張">−</button>' +
        '<span class="cr-stepper__field">' +
          '<input type="text" inputmode="numeric" class="cr-stepper__input" value="' + qty + '" ' + disabled + ' aria-label="改資買張數" />' +
          '<span class="cr-stepper__unit">張</span>' +
        '</span>' +
        '<button type="button" class="cr-stepper__btn" data-step="1" ' + incOff + ' aria-label="增加 1 張">+</button>' +

      var key = btn.getAttribute('data-sort');

  function updateStepper(wrap) {
    if (pageLocked) return;
    var id = wrap.getAttribute('data-stepper');
    var max = parseInt(wrap.getAttribute('data-max'), 10);
    var qty = clampQty(id, wrap.querySelector('.cr-stepper__input').value, max);
    wrap.querySelector('.cr-stepper__input').value = String(qty);
    wrap.querySelector('[data-step="-1"]').disabled = pageLocked || qty <= 0;
    wrap.querySelector('[data-step="1"]').disabled = pageLocked || qty >= max;
    wrap.closest('tr').classList.toggle('is-selected', qty > 0);
    var row = findRow(id);
    var est = wrap.closest('tr').querySelector('[data-est]');
    var remainCell = wrap.closest('tr').querySelector('[data-remain]');
    if (row && est) est.textContent = formatMoney(Math.round(estimateAmount(row)));
    if (row && remainCell) remainCell.textContent = remainingLots(row).toLocaleString('zh-TW');
    renderTotals();
    syncNext();
  }

  tbody.addEventListener('input', function (e) {
    if (pageLocked) return;

  function openEntryNotice() {

  function todayText() {
    var d = new Date();
    var m = d.getMonth() + 1;
    var day = d.getDate();
    return d.getFullYear() + '/' + (m < 10 ? '0' : '') + m + '/' + (day < 10 ? '0' : '') + day;
  }
  function appendRecords(items, status) {
    var records = loadRecords();
    var stamp = Date.now();
    items.forEach(function (r, i) {
      records.unshift({
        id: 'R' + stamp + '-' + r.id + '-' + i,
        date: todayText(),
        code: r.code,
        name: r.name,
        price: r.price,
        lots: r.lots,
        convert: getQty(r.id),
        status: status
      });
    });
    saveRecords(records);
    renderRecords();
  }
  document.getElementById('confirm-submit').addEventListener('click', function () {
    if (submitting || pageLocked) return;
    var items = readyItems();
    if (!items.length) { closeModal(); return; }
    submitting = true;
    syncNext();
    closeModal();
    if (isNetworkError()) {
      showSubmitResultNotice('network');
      appendRecords(items, 'error');
      submitting = false;
      syncNext();
      render();
      return;
    }
    if (isSystemControl()) {
      showSubmitResultNotice('control');
      appendRecords(items, 'control');
      submitting = false;
      syncNext();
      render();
      return;
    }
    if (isStockShortage()) {
      showSubmitResultNotice('source', items);
      appendRecords(items, 'source');
      submitting = false;
      syncNext();
      render();
      return;
    }
    appendRecords(items, 'approved');
    submitting = false;
    convertQty = {};
    render();
    showSubmitResultNotice('success');
  });

          window.location.hash = 'records';
        } else {
          showView('records');
        }
        return;
      }
      setUnavailableMode(false);
      if (value === 'none') {
        syncDemoParamsToUrl();
        return;
      }
      if (value === 'credit') {
        syncDemoParamsToUrl();
        goCreditOpen();
        return;
      }
      if ((window.location.hash || '') !== '#apply') {
        window.location.hash = 'apply';
      }
      openEntryNotice();
      syncDemoParamsToUrl();
    }

    noticeSel.addEventListener('change', function () {
      applyNoticeLive(noticeSel.value);
    });
    submitSel.addEventListener('change', function () {
      SUBMIT_TYPE = submitSel.value;
      syncDemoParamsToUrl();
    });
    if (triggerBtn) {
      triggerBtn.addEventListener('click', function () {
        applyNoticeLive(noticeSel.value);
      });
    }
    applyBtn.addEventListener('click', function () {
      var next = new URLSearchParams(window.location.search);
      next.set('notice', noticeSel.value);
      next.set('submit', submitSel.value);
      var hash = window.location.hash || '';
      window.location.href = window.location.pathname + '?' + next.toString() + hash;
    });
    var bar = document.getElementById('demo-bar');
    if (bar) {
      document.documentElement.style.setProperty('--demo-bar-h', bar.offsetHeight + 'px');
    }
  })();

  render();
  if (unavailableMode && (window.location.hash || '') !== '#records') {
    window.location.hash = 'records';
  } else {
    showView(parseView());
  }
})();
  </script>
</body>
</html>
