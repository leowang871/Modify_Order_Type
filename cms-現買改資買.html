<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>口袋證券 · 現買改資買 CMS 原型</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
/* ──────────────────────────────────────────────────────────────
   Design tokens（沿用 index1.html／web_style-guide.html）
   ────────────────────────────────────────────────────────────── */
:root {
  --brand-red:        rgb(230,   0,  57);
  --brand-coral:      rgb(249,  88, 104);
  --brand-coral-deep: rgb(233,  84, 101);
  --brand-crimson:    rgb(202,  16,  57);
  --brand-blush:      rgb(251, 227, 227);
  --brand-blush-soft: rgb(255, 183, 183);
  --brand-cream:      rgb(255, 242, 242);

  --neutral-0:   rgb(255, 255, 255);
  --neutral-50:  rgb(247, 247, 247);
  --neutral-100: rgb(245, 245, 245);
  --neutral-200: rgb(238, 238, 239);
  --neutral-400: rgb(200, 201, 202);
  --neutral-500: rgb(158, 158, 159);
  --neutral-700: rgb(113, 112, 113);

  --shadow-header:  0 1px 1px 0 rgba(0, 0, 0, 0.25);
  --shadow-sidebar: 1px 1px 4px 0 rgba(0, 0, 0, 0.25);
  --shadow-card:    3px 5px 10px 0 rgba(0, 0, 0, 0.10);

  --radius-sm:   6px;
  --radius-md:   8px;
  --radius-lg:  10px;
  --radius-pill: 15px;

  --font-sans: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
  --font-num:  "Inter", "PingFang TC", "Noto Sans TC", sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--brand-cream);
  font-family: var(--font-sans);
  color: #000;
}

#root { width: 100%; min-height: 100vh; }

/* ── CMS 外殼（header / sidebar / main） ───────────────────────── */
.cms-shell {
  width: 100%;
  min-height: 100vh;
  background: var(--brand-cream);
  display: grid;
  grid-template-columns: 248px minmax(0, 1fr);
  grid-template-rows: 60px 1fr;
  grid-template-areas:
    "header header"
    "side main";
}

.cms-header {
  grid-area: header;
  height: 60px;
  background: #fff;
  box-shadow: var(--shadow-header);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 30;
}

.cms-menu-btn {
  display: none;
  width: 40px;
  height: 40px;
  border: 1px solid var(--neutral-400);
  border-radius: var(--radius-md);
  background: #fff;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  flex-shrink: 0;
}

.cms-header__user {
  font-weight: 700;
  font-size: 16px;
  white-space: nowrap;
}

.cms-header__logout {
  margin-left: 8px;
  height: 35px;
  padding: 0 18px;
  background: #fff;
  color: var(--brand-coral-deep);
  border: 1px solid var(--brand-coral-deep);
  border-radius: var(--radius-md);
  font-family: inherit;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
  flex-shrink: 0;
}

.cms-header__logout:hover { background: var(--brand-blush); }

.cms-sidebar {
  grid-area: side;
  width: 248px;
  background: #fff;
  box-shadow: var(--shadow-sidebar);
  padding: 20px 20px 60px 32px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 25;
  overflow: auto;
}

.cms-nav-group {
  height: 40px;
  border: none;
  background: transparent;
  border-radius: var(--radius-pill);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0;
  font-family: inherit;
  font-weight: 500;
  font-size: 17px;
  color: #000;
  text-align: left;
  cursor: pointer;
}

.cms-nav-item {
  height: 30px;
  padding-left: 32px;
  display: flex;
  align-items: center;
  border: none;
  background: transparent;
  font-family: inherit;
  font-weight: 500;
  font-size: 15px;
  color: #000;
  text-align: left;
  cursor: pointer;
}

.cms-nav-item.is-active { color: var(--brand-coral-deep); }

.cms-main {
  grid-area: main;
  padding: 40px 36px 48px;
  overflow: auto;
  min-width: 0;
}

.cms-backdrop { display: none; }

.cms-card {
  background: #fff;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: 28px;
}

/* ── 現買改資買 頁面 ──────────────────────────────────────────── */
.mc-page-title {
  margin: 0 0 20px;
  font-size: clamp(20px, 2.5vw, 24px);
  font-weight: 700;
}

.mc-sheets {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  margin: 0 0 16px;
  border-bottom: 1px solid var(--neutral-200);
}

.mc-sheet {
  min-width: 140px;
  height: 40px;
  padding: 0 18px;
  margin-bottom: -1px;
  border: 1px solid var(--neutral-200);
  border-bottom: none;
  border-radius: 10px 10px 0 0;
  background: var(--neutral-50);
  color: var(--neutral-700);
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.mc-sheet.is-active {
  background: var(--brand-coral);
  border-color: var(--brand-coral);
  color: #fff;
}

.mc-notice {
  margin-bottom: 16px;
  padding: 10px 14px;
  border: 1px solid var(--brand-blush);
  border-radius: var(--radius-md);
  background: var(--brand-cream);
  color: var(--brand-crimson);
  font-size: 14px;
  font-weight: 500;
}

/* 查詢條件 */
.mc-query {
  margin-bottom: 16px;
  padding: 16px;
  background: rgb(248, 248, 249);
  border: 1px solid var(--neutral-200);
  border-radius: var(--radius-md);
}

.mc-query__title {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 12px;
}

.mc-query__fields {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px 16px;
  margin-bottom: 12px;
}

.mc-query__field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
}

.mc-query__field input,
.mc-query__field select {
  height: 35px;
  padding: 0 10px;
  border: 1px solid var(--neutral-400);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: inherit;
  background: #fff;
}

.mc-query__field input:focus,
.mc-query__field select:focus {
  outline: none;
  border-color: var(--brand-coral-deep);
}

.mc-query__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

/* 按鈕 */
.mc-btn {
  height: 34px;
  padding: 0 16px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
}

.mc-btn--primary {
  background: var(--brand-coral);
  border: 1px solid var(--brand-coral);
  color: #fff;
}

.mc-btn--primary:hover { background: var(--brand-crimson); border-color: var(--brand-crimson); }

.mc-btn--ghost {
  background: #fff;
  border: 1px solid var(--brand-coral-deep);
  color: var(--brand-coral-deep);
}

.mc-btn--ghost:hover { background: var(--brand-blush); }

.mc-btn--plain {
  background: #fff;
  border: 1px solid var(--neutral-400);
  color: var(--neutral-700);
}

.mc-btn--plain:hover { background: var(--neutral-50); }

.mc-btn:disabled {
  background: var(--neutral-100);
  border-color: var(--neutral-200);
  color: var(--neutral-500);
  cursor: not-allowed;
}

.mc-btn--primary:disabled,
.mc-btn--primary:disabled:hover {
  background: var(--neutral-100);
  border-color: var(--neutral-200);
  color: var(--neutral-500);
}

/* 表格上方工具列 */
.mc-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.mc-toolbar__meta {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--neutral-700);
}

.mc-toolbar__hint { color: var(--brand-red); font-weight: 500; }

/* 表格 */
.mc-table-wrap {
  width: 100%;
  overflow: auto;
  max-height: 480px;
  border-radius: var(--radius-md) var(--radius-md) 0 0;
  -webkit-overflow-scrolling: touch;
}

.mc-table-wrap table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.mc-th, .mc-td { text-align: center; vertical-align: middle; }

.mc-th {
  position: sticky;
  top: 0;
  z-index: 3;
  padding: 10px 4px;
  background: var(--brand-blush);
  font-weight: 600;
  font-size: 13px;
  line-height: 1.3;
  border-bottom: 1px solid var(--neutral-200);
}

.mc-th--group { border-left: 1px solid rgba(0, 0, 0, 0.08); }

.mc-td {
  padding: 11px 4px;
  border-bottom: 1px solid var(--neutral-200);
  white-space: nowrap;
}

.mc-td--stock { white-space: normal; line-height: 1.35; }

.mc-tr--odd { background: #fff; }
.mc-tr--even { background: var(--neutral-50); }

.mc-table-wrap tr.is-selected,
.mc-table-wrap tr.is-selected .mc-td {
  background: var(--brand-blush);
}

.mc-th--check,
.mc-td--check {
  width: 40px;
  min-width: 40px;
  max-width: 40px;
  padding: 10px 4px;
}

.mc-table__check-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
}

.mc-table-wrap input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--brand-coral);
  cursor: pointer;
}

.mc-td--num {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}

.mc-sort {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  border: none;
  background: transparent;
  color: inherit;
  font: inherit;
  font-weight: inherit;
  padding: 0;
  cursor: pointer;
}

.mc-sort:hover { color: var(--brand-coral-deep); }

.mc-sort__arrows {
  display: inline-flex;
  flex-direction: column;
  gap: 1px;
  line-height: 1;
  flex-shrink: 0;
}

.mc-sort__arrow { color: rgb(180, 180, 180); font-size: 9px; line-height: 1; }
.mc-sort__arrow.is-active { color: var(--brand-coral); }

.mc-empty {
  padding: 48px 16px;
  text-align: center;
  color: var(--neutral-700);
  font-size: 15px;
  background: #fff;
}

/* 類別標籤（現買／融資／融券） */
.mc-tag {
  display: inline-block;
  min-width: 40px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.5;
}

.mc-tag--cash   { background: var(--neutral-100); color: rgb(65, 65, 65); }
.mc-tag--margin { background: var(--brand-blush); color: var(--brand-crimson); }
.mc-tag--short  { background: rgb(232, 238, 254); color: rgb(58, 85, 184); }

/* 狀態 */
.mc-status {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
}

.mc-status--approved { background: #E4F3EB; color: rgb(31, 138, 91); }
.mc-status--source { background: #FFEAEA; color: var(--brand-crimson); }
.mc-status--error { background: #F3E8FF; color: #6B21A8; }
.mc-status--control { background: #FFF4E5; color: #B45309; }

/* 列內操作 */
.mc-row-actions {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  justify-content: center;
}

.mc-link {
  border: none;
  background: transparent;
  padding: 0;
  font: inherit;
  font-size: 14px;
  color: var(--brand-coral-deep);
  text-decoration: underline;
  cursor: pointer;
}

.mc-link--danger { color: var(--brand-crimson); }
.mc-link--ok { color: rgb(31, 138, 91); }

/* 分頁 */
.mc-pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 20px 16px 4px;
  flex-wrap: wrap;
}

.mc-pagination__btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1.5px solid var(--brand-coral-deep);
  background: #fff;
  color: var(--brand-coral-deep);
  font-size: 15px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.mc-pagination__btn:hover:not(:disabled):not(.is-active) { background: var(--brand-blush); }

.mc-pagination__btn.is-active {
  background: var(--brand-coral);
  border-color: var(--brand-coral);
  color: #fff;
  cursor: default;
}

.mc-pagination__btn:disabled {
  border-color: var(--neutral-400);
  color: var(--neutral-400);
  cursor: not-allowed;
}

.mc-pagination__info { font-size: 13px; color: var(--neutral-700); }

.mc-footer-actions {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 8px 0 4px;
}

.mc-btn--lg {
  height: 44px;
  padding: 0 28px;
  font-size: 16px;
  border-radius: var(--radius-md);
}

.mc-summary-lead {
  margin: 0 0 14px;
  font-size: 15px;
  line-height: 1.6;
}

.mc-summary-wrap {
  overflow-x: hidden;
  overflow-y: auto;
  max-height: min(420px, calc(100vh - 260px));
  border: 1px solid var(--neutral-200);
  border-radius: var(--radius-md);
}

.mc-summary-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  table-layout: auto;
}

.mc-summary-table th,
.mc-summary-table td {
  padding: 10px 10px;
  text-align: center;
  white-space: nowrap;
  border-bottom: 1px solid var(--neutral-200);
}

.mc-summary-table th {
  position: sticky;
  top: 0;
  background: var(--brand-blush);
  font-weight: 600;
}

.mc-summary-table tbody tr:nth-child(even) { background: var(--neutral-50); }

/* 彈窗 */
.mc-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

.mc-modal {
  width: 100%;
  max-width: 640px;
  max-height: calc(100vh - 48px);
  display: flex;
  flex-direction: column;
  background: #fff;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
}

.mc-modal--sm { max-width: 420px; }

.mc-modal.mc-modal--wide {
  width: min(1120px, calc(100vw - 32px));
  max-width: none;
}

.mc-modal__head {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 52px;
  padding: 12px 48px;
  background: var(--brand-coral);
  color: #fff;
  font-size: 20px;
  font-weight: 600;
}

.mc-modal__close {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  border: none;
  background: transparent;
  color: #fff;
  font-size: 26px;
  line-height: 1;
  cursor: pointer;
  padding: 0;
}

.mc-modal__body {
  padding: 20px 24px;
  overflow: auto;
}

.mc-modal__actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 16px 24px 20px;
  border-top: 1px solid var(--neutral-200);
}

.mc-modal__text { margin: 0; font-size: 15px; line-height: 1.7; }

.mc-detail-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px 24px;
}

.mc-detail-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--neutral-200);
}

.mc-detail-row--full { grid-column: 1 / -1; }

.mc-detail-row__label { font-size: 13px; color: var(--neutral-700); }
.mc-detail-row__value { font-size: 16px; font-weight: 500; }

.mc-modal__reason {
  width: 100%;
  min-height: 84px;
  margin-top: 10px;
  padding: 10px;
  border: 1px solid var(--neutral-400);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 15px;
  resize: vertical;
}

.mc-modal__reason:focus { outline: none; border-color: var(--brand-coral-deep); }

/* ── RWD ──────────────────────────────────────────────────────── */
@media (max-width: 1280px) {
  .mc-query__fields { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* 窄桌機：縮小外框留白，讓名單表格不需左右滑動 */
@media (max-width: 1200px) {
  .cms-main { padding: 28px 16px 40px; }
  .cms-card { padding: 20px 14px; }
}

@media (max-width: 1024px) {
  .cms-shell {
    grid-template-columns: 1fr;
    grid-template-rows: 60px 1fr;
    grid-template-areas:
      "header"
      "main";
  }

  .cms-menu-btn { display: inline-flex; align-items: center; justify-content: center; }

  .cms-header { padding: 0 16px; }

  .cms-header__user { font-size: 14px; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; }

  .cms-sidebar {
    position: fixed;
    top: 60px;
    left: 0;
    bottom: 0;
    width: min(280px, 88vw);
    transform: translateX(-100%);
    transition: transform 0.2s ease;
  }

  .cms-sidebar.is-open { transform: translateX(0); }

  .cms-backdrop {
    display: block;
    position: fixed;
    inset: 60px 0 0 0;
    border: none;
    background: rgba(0, 0, 0, 0.35);
    z-index: 24;
    cursor: pointer;
  }

  .cms-main { padding: 24px 16px 32px; }

  .mc-query__fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 768px) {
  .cms-card { padding: 20px 16px; }
  .mc-query__fields { grid-template-columns: 1fr; }
  .mc-detail-grid { grid-template-columns: 1fr; }
}

@media (max-width: 480px) {
  .cms-header__user { display: none; }
}
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>

  <script type="text/babel" data-cms="page">
/* ══════════════════════════════════════════════════════════════
   現買改資買 CMS 原型（方案 B：唯讀監控）
   僅顯示線上改類申請紀錄；無審核、無電話案件、無 AS400 操作。
   資料為前端假資料，查詢／匯出為前端模擬，未接後端 API。
   ══════════════════════════════════════════════════════════════ */

/* ── ① 假資料：之後接 API 就換掉這個陣列 ────────────────────────
   tradeDate/offsetDate/applyDate 用 YYYY-MM-DD，畫面顯示自動轉民國年。
   fromType / toType： 現買 = cash、融資 = margin、融券 = short
   lots：成交張數；toLots：更正後張數（可小於成交張數，表示只改部分張）
   idNo：身分證字號（畫面欄位標為 ID）
   status： approved 已通過、source 配額不足、error 系統錯誤、control 系統管制
   單頁查詢；成交日期起迄預設為當日（BUSINESS_DATE），可擴大查詢歷史。
   ※ 列唯一鍵為 id（如 R001），與身分證 idNo 不同。 */
function todayIso() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
const BUSINESS_DATE = todayIso();

const MOCK_ROWS = [

/* ── 格式化工具 ───────────────────────────────────────────────── */
function formatRocDate(iso) {
  if (!iso) return '－';
  const [y, m, d] = iso.split('-');
  return `${Number(y) - 1911}/${m}/${d}`;
}

function formatNumber(n) {
  return Number(n).toLocaleString('zh-TW');
}

function formatPrice(n) {
  return Number(n).toLocaleString('zh-TW', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function TypeTag({ type }) {
  const t = TYPE_MAP[type];
  if (!t) return <span>－</span>;
  return <span className={`mc-tag ${t.className}`}>{t.label}</span>;
}

function StatusPill({ status }) {
  const s = STATUS_MAP[status] || STATUS_MAP.approved;
  return <span className={`mc-status ${s.className}`}>{s.label}</span>;
}

function SortHeader({ column, sort, onSort }) {
  if (!column.sortable) return <span>{column.label}</span>;
  const active = sort.key === column.key;
  return (
    <button type="button" className="mc-sort" onClick={() => onSort(column.key)}>
      <span>{column.label}</span>
      <span className="mc-sort__arrows" aria-hidden="true">
        <span className={'mc-sort__arrow' + (active && sort.dir === 'asc' ? ' is-active' : '')}>▲</span>
        <span className={'mc-sort__arrow' + (active && sort.dir === 'desc' ? ' is-active' : '')}>▼</span>
      </span>
    </button>
  );
}

function Pagination({ page, totalItems, onChange }) {
  const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
  const pages = [];
  for (let i = 1; i <= totalPages; i += 1) pages.push(i);
  return (
    <nav className="mc-pagination" aria-label="分頁">
      <button type="button" className="mc-pagination__btn" disabled={page <= 1} onClick={() => onChange(page - 1)} aria-label="上一頁">‹</button>
      {pages.map(p => (
        <button
          key={p}
          type="button"
          className={'mc-pagination__btn' + (p === page ? ' is-active' : '')}
          onClick={() => p !== page && onChange(p)}
          aria-current={p === page ? 'page' : undefined}
        >{p}</button>
      ))}
      <button type="button" className="mc-pagination__btn" disabled={page >= totalPages} onClick={() => onChange(page + 1)} aria-label="下一頁">›</button>
      <span className="mc-pagination__info">共 {formatNumber(totalItems)} 筆</span>
    </nav>
  );
}

function MarginChangePage() {
  const [rows] = React.useState(MOCK_ROWS);
  const [draftQuery, setDraftQuery] = React.useState(EMPTY_QUERY);
  const [query, setQuery] = React.useState(EMPTY_QUERY);
  const [sort, setSort] = React.useState({ key: 'tradeDate', dir: 'desc' });
  const [page, setPage] = React.useState(1);
  const [notice, setNotice] = React.useState('');

  const setField = (key, value) => setDraftQuery(q => ({ ...q, [key]: value }));

  const filtered = React.useMemo(() => {
    const keyword = query.stock.trim().toLowerCase();
    return rows.filter(r => {
      if (query.dateStart && r.tradeDate < query.dateStart) return false;
      if (query.dateEnd && r.tradeDate > query.dateEnd) return false;
      if (query.orderNo && !r.orderNo.toLowerCase().includes(query.orderNo.trim().toLowerCase())) return false;
      if (query.idNo && !(r.idNo || '').toUpperCase().includes(query.idNo.trim().toUpperCase())) return false;
      if (query.account && !r.account.includes(query.account.trim())) return false;
      if (keyword && !(r.stockName.toLowerCase().includes(keyword) || r.stockCode.includes(keyword))) return false;
      if (query.status && r.status !== query.status) return false;
      return true;
    });
  }, [rows, query]);

  const sorted = React.useMemo(() => {
    const list = [...filtered];
    list.sort((a, b) => {
      const av = a[sort.key];
      const bv = b[sort.key];
      let cmp;
      if (typeof av === 'number' && typeof bv === 'number') cmp = av - bv;
      else cmp = String(av).localeCompare(String(bv), 'zh-Hant');
      return sort.dir === 'asc' ? cmp : -cmp;
    });
    return list;
  }, [filtered, sort]);

  const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
  const currentPage = Math.min(page, totalPages);
  const pageRows = sorted.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  const runSearch = () => {
    setQuery(draftQuery);
    setPage(1);
    setNotice('');
  };

  const clearQuery = () => {
    setDraftQuery(EMPTY_QUERY);
    setQuery(EMPTY_QUERY);
    setPage(1);
    setNotice('');
  };

  const toggleSort = key => {
    setSort(s => (s.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' }));
  };

  const exportCsv = () => {
    const cellValue = (c, r) => {
      if (c.key === 'tradeDate' || c.key === 'offsetDate') return formatRocDate(r[c.key]);
      if (c.key === 'stockName') return `${r.stockName} (${r.stockCode})`;
      if (c.key === 'side') return SIDE_MAP[r.side] || r.side;
      if (c.key === 'lots' || c.key === 'toLots') return r[c.key];
      if (c.key === 'price') return formatPrice(r.price);
      if (c.key === 'fromType' || c.key === 'toType') return TYPE_MAP[r[c.key]].label;
      if (c.key === 'status') return STATUS_MAP[r.status].label;
      return r[c.key] ?? '';
    };
    const header = [...COLUMNS.map(c => c.label), '原因說明'];
    const lines = sorted.map(r => ([
      ...COLUMNS.map(c => cellValue(c, r)),
      r.reason || '',
    ]));
    const csv = [header, ...lines]
      .map(cols => cols.map(v => `"${String(v).replace(/"/g, '""')}"`).join(','))
      .join('\r\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `現買改資買_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    setNotice(`已匯出 ${sorted.length} 筆資料`);
  };

  return (
    <div className="cms-card">
      <h1 className="mc-page-title">現買改資買</h1>

      {notice && <div className="mc-notice" role="status">{notice}</div>}

      {/* 查詢條件 */}
      <div className="mc-query">
        <span className="mc-query__title">查詢條件</span>
        <div className="mc-query__fields">
          <label className="mc-query__field">
            <span>成交日期（起）</span>
            <input type="date" value={draftQuery.dateStart} onChange={e => setField('dateStart', e.target.value)} />
          </label>
          <label className="mc-query__field">
            <span>成交日期（迄）</span>
            <input type="date" value={draftQuery.dateEnd} onChange={e => setField('dateEnd', e.target.value)} />
          </label>
          <label className="mc-query__field">
            <span>委託書編號</span>
            <input type="text" value={draftQuery.orderNo} onChange={e => setField('orderNo', e.target.value)} placeholder="輸入委託書編號" />
          </label>
          <label className="mc-query__field">
            <span>ID</span>
            <input type="text" value={draftQuery.idNo} onChange={e => setField('idNo', e.target.value)} placeholder="身分證字號" maxLength={10} />
          </label>
          <label className="mc-query__field">
            <span>委託人帳號</span>
            <input type="text" value={draftQuery.account} onChange={e => setField('account', e.target.value)} placeholder="台股帳號 7 碼" maxLength={7} />
          </label>
          <label className="mc-query__field">
            <span>股票名稱／代號</span>
            <input type="text" value={draftQuery.stock} onChange={e => setField('stock', e.target.value)} placeholder="例：台積電 或 2330" />
          </label>
          <label className="mc-query__field">
            <span>狀態</span>
            <select value={draftQuery.status} onChange={e => setField('status', e.target.value)}>
              <option value="">全部</option>
              <option value="approved">已通過</option>
              <option value="source">配額不足</option>
              <option value="error">系統錯誤</option>
              <option value="control">系統管制</option>
            </select>
          </label>
        </div>
        <div className="mc-query__actions">
          <button type="button" className="mc-btn mc-btn--plain" onClick={clearQuery}>清除</button>
          <button type="button" className="mc-btn mc-btn--primary" onClick={runSearch}>查詢</button>
          <button type="button" className="mc-btn mc-btn--primary" onClick={exportCsv} disabled={sorted.length === 0}>匯出名單</button>
        </div>
      </div>

      {/* 工具列 */}
      <div className="mc-toolbar">
        <div className="mc-toolbar__meta">
          <span>符合 <strong>{formatNumber(filtered.length)}</strong> 筆</span>
        </div>
        <div className="mc-toolbar__meta">
          <span>營業日：{formatRocDate(BUSINESS_DATE)}（預設查詢當日）</span>
        </div>
      </div>

      {/* 名單表格 */}
      <div className="mc-table-wrap">
        <table>
          <thead>
            <tr>
              {COLUMNS.map(c => (
                <th key={c.key} className="mc-th">
                  <SortHeader column={c} sort={sort} onSort={toggleSort} />
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {pageRows.map((r, i) => (
              <tr
                key={r.id}
                className={i % 2 === 0 ? 'mc-tr--odd' : 'mc-tr--even'}
              >
                {COLUMNS.map(c => (
                  <td key={c.key} className={'mc-td' + (c.numeric ? ' mc-td--num' : '') + (c.className ? ' ' + c.className : '')}>
                    {c.render ? c.render(r) : r[c.key]}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
        {pageRows.length === 0 && <div className="mc-empty">查無符合條件的資料</div>}
      </div>

      <Pagination page={currentPage} totalItems={sorted.length} onChange={setPage} />
    </div>
  );
}

function App() {
  return (
    <Shell>
      <MarginChangePage />
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
